<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Asipho</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#ff7ab8;font-family:'Caveat',cursive,sans-serif;overflow:hidden}
.s{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.s.on{display:flex}
.btn{margin-top:6px;width:100%;background:#f42b83;color:#fff;border:0;border-radius:24px;padding:14px 28px;font:700 1.4rem 'Caveat';cursor:pointer;text-decoration:none;display:inline-block}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#ff91c5}
.muted{color:#9c6f87;margin-top:18px}
.pin-card{position:relative;width:min(420px,100%);text-align:center;z-index:2}
.mini-heart{font-size:34px;color:#f42b83;margin:12px}
.pin-card h1{font-family:'Caveat',cursive;font-size:clamp(48px,10vw,76px);font-weight:400;line-height:.95;margin:12px 0}
.pin-card p{line-height:1.6;color:#d8b4c7;font-size:1.25rem;margin:0}
.pin-input{width:100%;margin:18px 0 12px;padding:16px;border-radius:12px;border:1px solid #67314f;background:#170d17;color:#fff;text-align:center;letter-spacing:.4em;font:18px Arial,sans-serif;outline:none}
.error{height:20px;color:#ff91c5;font:12px Arial,sans-serif}
.matrix{position:absolute;inset:0;overflow:hidden;opacity:.65;pointer-events:none}
.rain{position:absolute;top:-120%;color:#ff62b1;font:12px/1.7 monospace;writing-mode:vertical-rl;text-shadow:0 0 8px #ff198b;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(240vh)}}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#cv{position:fixed;inset:0}
#cd{position:relative;font-size:9rem;font-weight:700;color:#ffb3d9;text-shadow:0 0 30px #ff4f9a;animation:pop 1s infinite}
@keyframes pop{0%{transform:scale(1.5);opacity:0}30%{opacity:1}100%{transform:scale(.9)}}
#ttl{position:relative;font-size:3.2rem;line-height:1.1;color:#ffd1e8;text-shadow:0 0 25px #ff4f9a}
#gifts{background:linear-gradient(#fff4f8,#ffd9e8);color:#c2185b}
#gifts h2{font-size:2.2rem;margin:0 0 20px}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.box{width:96px;height:96px;position:relative;cursor:pointer;margin-top:26px;transition:transform .2s}
.box:hover{transform:scale(1.07)}
.box .b{position:absolute;inset:18px 0 0;border-radius:6px;background:var(--c);box-shadow:0 6px 14px #0002}
.box .l{position:absolute;left:-5px;right:-5px;top:4px;height:22px;border-radius:5px;background:var(--d);transition:transform .5s}
.box .b:before{content:"";position:absolute;left:44%;width:12%;top:0;bottom:0;background:#fff8}
.box .l:after{content:"\2740";position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:30px;color:#fff;text-shadow:0 0 3px #0004}
.box.o .l{transform:translateY(-34px) rotate(-14deg)}
.m{position:fixed;inset:0;background:#fff4f8;display:none;overflow:auto;z-index:5;padding:16px;text-align:center;color:#8e1650}
.m.on{display:block}
.x{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;font-size:2rem;background:none;border:0;color:#c2185b;cursor:pointer;z-index:6}
.fl{display:flex;align-items:center;justify-content:center;gap:6px;min-height:80vh}
.fl svg{width:56%;max-width:420px}
.col{display:flex;flex-direction:column;gap:22px;width:22%}
.col span{font-size:clamp(.9rem,3.4vw,1.4rem);background:#fff;border-radius:14px;padding:6px 8px;box-shadow:0 3px 8px #c2185b22;animation:fl 4s ease-in-out infinite alternate}
.col:last-child span{animation-delay:1.5s}
@keyframes fl{to{transform:translateY(-8px)}}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-width:700px;margin:10px auto}
.ph div,.ph img{aspect-ratio:1;width:100%;object-fit:cover;object-position:center 22%;cursor:pointer;border-radius:6px;background:#fff;border:6px solid #fff;box-shadow:0 3px 8px #0003;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#ffb3d9}
.paper{max-width:560px;margin:30px auto;background:#fffdf7;padding:28px 26px;border-radius:4px;box-shadow:0 8px 24px #0003;text-align:left;font-size:1.6rem;line-height:1.35;color:#3a2a4a;background-image:repeating-linear-gradient(transparent 0 33px,#f3c9da55 33px 34px)}
.paper p{margin:0 0 14px}
.fp{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.2s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
</style></head><body>

<div class="s on" id="pin">
  <div class="matrix" id="pinMatrix"></div>
  <div class="pin-card">
    <div class="eyebrow">A little something, just for you</div>
    <div class="mini-heart">&hearts;</div>
    <h1>For you,<br><i>Asipho.</i></h1>
    <p>Some things are worth unlocking.<br>Enter the date that made today possible.</p>
    <form id="pinForm">
      <input id="pinInput" class="pin-input" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="DDMMYYYY" aria-label="Birthday PIN" required>
      <button class="btn" type="submit">Unlock your surprise &hearts;</button>
      <div class="error" id="pinError" aria-live="polite"></div>
    </form>
    <div class="muted" style="font:10px Arial,sans-serif;letter-spacing:.12em">A PRIVATE LITTLE UNIVERSE</div>
  </div>
</div>

<div class="s" id="mx"><canvas id="cv"></canvas><div id="cd">3</div><div id="ttl" style="display:none"></div></div>

<div class="s" id="gifts">
<h2>Three gifts for you, Asipho &#127872;</h2>
<div class="row">
<div class="box" data-n="1" style="--c:#ff7ab8;--d:#e0407f"><div class="l"></div><div class="b"></div></div>
<div class="box" data-n="2" style="--c:#ff9a9e;--d:#e56b72"><div class="l"></div><div class="b"></div></div>
<div class="box" data-n="3" style="--c:#c9a7ff;--d:#9b6fe0"><div class="l"></div><div class="b"></div></div>
</div>
<p style="font-size:1.3rem;margin-top:28px">Tap a box to open it</p>
</div>

<div class="m" id="m"><button class="x" id="cl">&times;</button><div id="mc"></div></div>

<script>
const $=s=>document.querySelector(s);
const show=id=>{document.querySelectorAll('.s').forEach(e=>e.classList.remove('on'));$(id).classList.add('on')};
// PIN: 12 Oct 2006 (DDMMYYYY or MMDDYYYY)
const OK=['12102006','10122006'];
$('#pinForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#pinInput').value.replace(/\D/g,'');
 if(OK.includes(v)){start()}else{$('#pinError').textContent='Not quite, think of today \u2665';const c=document.querySelector('.pin-card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}});
function makeRain(id,count=55){const host=document.getElementById(id);
 for(let i=0;i<count;i++){const sp=document.createElement('span');sp.className='rain';
  sp.textContent=Array.from({length:24},()=>Math.random()>.5?'1':'0').join('\n');
  sp.style.left=(i/count*100)+'%';sp.style.animationDuration=(5+Math.random()*8)+'s';sp.style.animationDelay=(-Math.random()*12)+'s';sp.style.opacity=(.25+Math.random()*.7).toFixed(2);host.appendChild(sp)}}
makeRain('pinMatrix',55);

// Matrix + fireworks
const cv=$('#cv'),cx=cv.getContext('2d');let cols,drops,fw=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16);drops=Array(cols).fill(0).map(()=>Math.random()*-50)}
addEventListener('resize',rs);
function loop(){cx.fillStyle='rgba(0,0,0,.09)';cx.fillRect(0,0,cv.width,cv.height);
 cx.font='16px monospace';cx.fillStyle='#ff5fa2';
 drops.forEach((y,i)=>{cx.fillText(Math.random()<.5?'0':'1',i*16,y*16);drops[i]=y*16>cv.height&&Math.random()>.975?0:y+1});
 fw=fw.filter(p=>p.l>0);fw.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.l--;cx.globalAlpha=Math.max(p.l/70,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.2,0,7);cx.fill()});cx.globalAlpha=1;
 requestAnimationFrame(loop)}
function burst(){const x=cv.width*(.15+Math.random()*.7),y=cv.height*(.15+Math.random()*.4),c=['#ff4f9a','#ffd1e8','#fff','#ffb347','#ff7a7a'][Math.floor(Math.random()*5)];
 for(let i=0;i<80;i++){const a=Math.random()*6.28,s=1+Math.random()*4;fw.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70+Math.random()*20,c})}}
function start(){show('#mx');rs();loop();let n=3;const cd=$('#cd');
 const t=setInterval(()=>{n--;cd.textContent=n;if(n===0){clearInterval(t);setTimeout(fire,900)}},1000)}
function fire(){$('#cd').style.display='none';const T=$('#ttl');T.style.display='block';T.innerHTML='Happy Birthday<br>Asipho &#127874;';
 burst();const f=setInterval(burst,500);
 setTimeout(()=>{clearInterval(f);let d=0;T.innerHTML='Loading<span id="dd"></span>';
  const l=setInterval(()=>{d=(d+1)%4;const e=$('#dd');if(e)e.textContent='.'.repeat(d)},350);
  setTimeout(()=>{clearInterval(l);show('#gifts')},2800)},7500)}

// Hand-drawn flowers
const J=(r)=>(Math.random()-.5)*r;
function flower(x,y,r,n,col,top){let s='';
 s+=`<path class="fp" pathLength="1" d="M${x} ${y+r*.4} Q${x+J(30)} ${(y+top)/2} ${x+J(8)} ${top}" fill="none" stroke="#3d7a4a" stroke-width="3" stroke-linecap="round"/>`;
 for(let i=0;i<n;i++){const a=i/n*6.283,ca=Math.cos(a),sa=Math.sin(a),px=-sa,py=ca;
  const x1=x+ca*r*1.5+J(5),y1=y+sa*r*1.5+J(5),w=r*.55;
  s+=`<path class="fp" pathLength="1" style="animation-delay:${.4+i*.12}s" d="M${x+ca*6} ${y+sa*6} Q${x+ca*r*.8+px*w+J(4)} ${y+sa*r*.8+py*w+J(4)} ${x1} ${y1} Q${x+ca*r*.8-px*w+J(4)} ${y+sa*r*.8-py*w+J(4)} ${x+ca*6+J(2)} ${y+sa*6+J(2)}" fill="${col}33" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`}
 s+=`<path class="fp" pathLength="1" style="animation-delay:1.6s" d="M${x-7} ${y} Q${x} ${y-9} ${x+7} ${y} Q${x} ${y+8} ${x-8} ${y+1}" fill="#f6b73c88" stroke="#c98a14" stroke-width="2"/>`;return s}
function flowers(){return `<svg viewBox="0 0 300 380">${flower(150,120,34,8,'#d6336c',330)+flower(80,200,26,6,'#e8590c',340)+flower(220,190,28,7,'#9c36b5',335)+flower(115,270,20,5,'#e64980',345)+flower(190,275,20,5,'#f08c00',345)}
 <path class="fp" pathLength="1" style="animation-delay:2s" d="M60 360 Q150 345 245 362" fill="none" stroke="#3d7a4a" stroke-width="2.5"/></svg>`}
const L=['Forever and Always','My favorite ex','MaSokhela','You + me = forever','You\u2019re my favorite notification','Home is wherever you are'];
const R=['Khaya lami','Happy 20th!!','Choosing you, everytime','Ungishaya ding dong','Thank you for being you','Mine \u2764'];
const col=a=>`<div class="col">${a.map(t=>`<span>${t}</span>`).join('')}</div>`;

const SONG_SRC='';let aud=null;
function photos(){const g=PHOTOS.length?PHOTOS.map(s=>`<img src="${s}" alt="">`).join(''):Array(6).fill('<div>&#128247;</div>').join('');
 return `<h2 style="font-size:2.2rem;margin:50px 0 4px">My favorite glimpses of you &#128248;</h2><div class="ph">${g}</div>`}
function letter(){return `<div class="paper">
<p>My Destiny,</p>
<p>Happy 20th birthday!! Another reminder ukuthi ngimdala kunawe. I cannot post you ngenxa yokuthi I have to respect lona okhona, so I built you this instead. I wanted to give you something that couldn\u2019t be bought, so I built you a little corner of the internet for wena..AGAIN. Forgive the PIN, I had to make sure only the birthday girl got in.</p>
<p>My favorite ex madoda, and honestly my favorite everything. MaSokhela. Somehow every road I take ends up back at you, and my heart has never once argued about it.</p>
<p>Thank you for your laughs, your patience, and the way you make ordinary days feel like they matter. If I could wrap up one thing for you, it would be how it feels njalo menginawe.</p>
<p>May this year be soft with you, loud with joy, and full of everything you\u2019ve been praying for. I\u2019ll be right here, cheering the loudest.</p>
<p>Yimina owakho Thembalami,<br>Alwande &#10084;</p></div>`}

document.querySelectorAll('.box').forEach(b=>b.onclick=()=>{b.classList.add('o');if(b.dataset.n==='2'&&SONG_SRC){aud=aud||new Audio(SONG_SRC);aud.loop=true;aud.currentTime=0;aud.play().catch(()=>{})}setTimeout(()=>{const n=b.dataset.n;
 $('#mc').innerHTML=n==='1'?`<div class="fl">${col(L)}${flowers()}${col(R)}</div>`:n==='2'?photos():letter();
 $('#m').classList.add('on');$('#m').scrollTop=0;b.classList.remove('o')},650)});
document.addEventListener('click',e=>{if(e.target.matches('.ph img')){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:9;background:#000e;display:flex;align-items:center;justify-content:center';o.innerHTML='<img src="'+e.target.src+'" style="max-width:94vw;max-height:92vh;border-radius:6px">';o.onclick=()=>o.remove();document.body.appendChild(o)}});
$('#cl').onclick=()=>{$('#m').classList.remove('on');if(aud)aud.pause()};
</script></body></html>
